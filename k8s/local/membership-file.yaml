# Laptop only: keep ring membership in a file on a small persistent disk (ring-pvc.yaml),
# shared by all Partition Manager pods. On GKE: Firestore.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partition-manager
  namespace: s1
spec:
  template:
    spec:
      containers:
        - name: partition-manager
          env:
            - { name: MEMBERSHIP_BACKEND, value: file }
            - { name: MEMBERSHIP_FILE, value: /ring/membership.json }
          volumeMounts:
            - { name: ring, mountPath: /ring }
      volumes:
        - name: ring
          persistentVolumeClaim: { claimName: ring-membership }
