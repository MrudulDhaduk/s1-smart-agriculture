# Secrets never go into Git. Terraform writes them to GCP Secret Manager; the External Secrets
# Operator (installed by ArgoCD, identity s1-external-secrets via Workload Identity) copies them
# into Kubernetes Secrets here and refreshes them. Pods only ever see ordinary Secrets.
#
# SkipDryRunOnMissingResource: on the very first sync these kinds may not exist yet (the operator
# is installed by a separate ArgoCD Application); ArgoCD retries until they do.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: s1-agri-ams-686974   # no auth block: the operator's own Workload Identity is used
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-config
  namespace: s1
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: gcp-secret-manager }
  target: { name: gcp-config }
  dataFrom:
    - extract: { key: s1-runtime-config }   # infra/foundation/runtime_config.tf (JSON -> one key per field)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-client
  namespace: s1
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: gcp-secret-manager }
  target: { name: kafka-client }
  dataFrom:
    - extract: { key: kafka-client }         # infra/kafka/secrets.tf
