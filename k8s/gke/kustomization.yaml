# GKE version of the app: what ArgoCD deploys (Application "s1", path k8s/gke).
# = k8s/base + the things that only make sense on our GCP project:
#   images             pulled from Artifact Registry, tagged with the git commit (tools/build_push.sh)
#   workload-identity  each Kubernetes service account acts as its Google service account
#   gcp-env            pods read cloud settings and Kafka credentials from Secrets
#   external-secrets   those Secrets are copied from Secret Manager (written there by Terraform)
#   ingress            one public HTTP load balancer for the REST services
# Project-specific values (project id s1-agri-ams-686974) live only in this folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - external-secrets.yaml
  - ingress.yaml
patches:
  - path: workload-identity.yaml
  - path: gcp-env.yaml

# One line per image so tools/build_push.sh can update newTag with sed.
images:
  - { name: s1/partition-manager, newName: us-central1-docker.pkg.dev/s1-agri-ams-686974/s1/partition-manager, newTag: "2877b49b0f" }
  - { name: s1/sensor-store, newName: us-central1-docker.pkg.dev/s1-agri-ams-686974/s1/sensor-store, newTag: "2877b49b0f" }
  - { name: s1/farm-registry, newName: us-central1-docker.pkg.dev/s1-agri-ams-686974/s1/farm-registry, newTag: "2877b49b0f" }
  - { name: s1/sensor-registry, newName: us-central1-docker.pkg.dev/s1-agri-ams-686974/s1/sensor-registry, newTag: "2877b49b0f" }
  - { name: s1/irrigation-controller, newName: us-central1-docker.pkg.dev/s1-agri-ams-686974/s1/irrigation-controller, newTag: "2877b49b0f" }
