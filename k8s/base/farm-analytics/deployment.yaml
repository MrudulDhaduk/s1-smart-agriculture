apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm-analytics
  namespace: s1
spec:
  replicas: 1
  selector:
    matchLabels: { app: farm-analytics }
  template:
    metadata:
      labels: { app: farm-analytics }
    spec:
      serviceAccountName: farm-analytics
      terminationGracePeriodSeconds: 20
      containers:
        - name: farm-analytics
          image: s1/farm-analytics:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: KAFKA_RESULTS_TOPIC, value: results }
            - { name: KAFKA_GROUP_ID, value: farm-analytics }
            - { name: ANALYTICS_STORE, value: firestore }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
