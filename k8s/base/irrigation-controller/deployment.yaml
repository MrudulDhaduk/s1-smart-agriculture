# Irrigation Controller = stateless: the watering cooldown lives in Firestore on GKE (in memory
# on a laptop). One replica is enough: the control loop runs every 30 s, and a second replica
# would only repeat the same reads (it could not double-water: the cooldown is transactional).
# Defaults reach Farm Registry, Sensor Registry and Partition Manager by their Service names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: irrigation-controller
  namespace: s1
spec:
  replicas: 1
  selector:
    matchLabels: { app: irrigation-controller }
  template:
    metadata:
      labels: { app: irrigation-controller }
    spec:
      serviceAccountName: irrigation-controller
      terminationGracePeriodSeconds: 20   # finish the current cycle and flush Kafka
      containers:
        - name: irrigation-controller
          image: s1/irrigation-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: EVAL_INTERVAL_S, value: "30" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
