# Sensor Registry = stateless REST service (its data lives in Cloud SQL), so a Deployment.
# It calls Farm Registry at http://farm-registry (the default) to check that a plot exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-registry
  namespace: s1
spec:
  replicas: 2
  selector:
    matchLabels: { app: sensor-registry }
  template:
    metadata:
      labels: { app: sensor-registry }
    spec:
      serviceAccountName: sensor-registry
      containers:
        - name: sensor-registry
          image: s1/sensor-registry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
