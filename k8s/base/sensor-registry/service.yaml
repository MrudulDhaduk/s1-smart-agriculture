# One stable name (http://sensor-registry) in front of all Sensor Registry pods.
apiVersion: v1
kind: Service
metadata:
  name: sensor-registry
  namespace: s1
  labels: { app: sensor-registry }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'   # GKE: the load balancer sends traffic straight to pods
spec:
  selector: { app: sensor-registry }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 8000, targetPort: metrics }
