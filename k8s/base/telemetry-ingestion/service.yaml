apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingestion
  namespace: s1
  labels: { app: telemetry-ingestion }
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector: { app: telemetry-ingestion }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 8000, targetPort: metrics }
