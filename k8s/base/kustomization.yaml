# The list of manifests that make up our app, independent of where it runs.
# Laptop version: k8s/local/ (adds metrics-server, a localhost entry point, file membership).
# GKE version:    k8s/gke/   (adds registry images, Workload Identity, secrets, public Ingress);
#                 ArgoCD tracks k8s/gke.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sensor-store/service.yaml
  - sensor-store/statefulset.yaml
  - sensor-store/pdb.yaml
  - sensor-store/networkpolicy.yaml
  - partition-manager/serviceaccount.yaml
  - partition-manager/service.yaml
  - partition-manager/deployment.yaml
  - partition-manager/hpa.yaml
  - partition-manager/pdb.yaml
  - farm-registry/serviceaccount.yaml
  - farm-registry/service.yaml
  - farm-registry/deployment.yaml
  - sensor-registry/serviceaccount.yaml
  - sensor-registry/service.yaml
  - sensor-registry/deployment.yaml
  - irrigation-controller/serviceaccount.yaml
  - irrigation-controller/service.yaml
  - irrigation-controller/deployment.yaml
  - telemetry-ingestion/service.yaml
  - telemetry-ingestion/deployment.yaml
  - telemetry-ingestion/hpa.yaml
