# Partition Manager = stateless router -> a Deployment of identical, interchangeable pods.
# The HPA (hpa.yaml) changes `replicas` automatically between 2 and 6.
#
# Ring membership: on GKE it lives in Firestore (shared by all pods).
# k8s/local switches it to a shared file for Docker Desktop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partition-manager
  namespace: s1
spec:
  replicas: 2
  selector:
    matchLabels: { app: partition-manager }
  template:
    metadata:
      labels: { app: partition-manager }
    spec:
      containers:
        - name: partition-manager
          image: s1/partition-manager:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: INITIAL_NODES, value: "sensor-store-0,sensor-store-1,sensor-store-2,sensor-store-3" }
            - { name: NODE_ADDRESS, value: "{node}.sensor-store:50052" }   # headless Service DNS
            - { name: MEMBERSHIP_BACKEND, value: firestore }
            - { name: VNODES, value: "100" }
            - { name: REPLICAS, value: "3" }
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: metrics, containerPort: 8000 }
          readinessProbe:
            tcpSocket: { port: 50051 }
            periodSeconds: 5
          resources:
            # HPA measures CPU as a % of this request: 50% target = 50m (0.05 of a CPU core)
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
