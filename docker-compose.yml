# Run the whole system on your laptop:   docker compose up --build
# Stop it:                                 docker compose down      (add -v to also wipe the data)
#
# Person 3 services first, then Person 1's (registries, Irrigation Controller, Postgres, Kafka).
# 5 Sensor Store nodes run, but only 0-3 start on the ring; sensor-store-4 is
# there so the demo can do:  python pmctl.py add-node sensor-store-4
# Test data for the registries:   python tools/seed_registries.py

x-sensor-store: &sensor-store
  build:
    context: .
    dockerfile: services/sensor-store/Dockerfile
  image: s1/sensor-store
  restart: unless-stopped   # restart after a crash, but not after `docker compose stop`

services:
  partition-manager:
    build:
      context: .
      dockerfile: services/partition-manager/Dockerfile
    image: s1/partition-manager
    restart: unless-stopped
    environment:
      INITIAL_NODES: sensor-store-0,sensor-store-1,sensor-store-2,sensor-store-3
      NODE_ADDRESS: "{node}:50052"
      MEMBERSHIP_BACKEND: file
      MEMBERSHIP_FILE: /ring/membership.json
    volumes:
      - ring:/ring
    ports:
      - "50051:50051"   # gRPC
      - "8000:8000"     # metrics: http://localhost:8000/metrics
    depends_on: [sensor-store-0, sensor-store-1, sensor-store-2, sensor-store-3, sensor-store-4]

  sensor-store-0:
    <<: *sensor-store
    environment: { NODE_NAME: sensor-store-0 }
    volumes: [ "store0:/data" ]
  sensor-store-1:
    <<: *sensor-store
    environment: { NODE_NAME: sensor-store-1 }
    volumes: [ "store1:/data" ]
  sensor-store-2:
    <<: *sensor-store
    environment: { NODE_NAME: sensor-store-2 }
    volumes: [ "store2:/data" ]
  sensor-store-3:
    <<: *sensor-store
    environment: { NODE_NAME: sensor-store-3 }
    volumes: [ "store3:/data" ]
  sensor-store-4:
    <<: *sensor-store
    environment: { NODE_NAME: sensor-store-4 }
    volumes: [ "store4:/data" ]

  # ---------- Person 1: registries, Irrigation Controller, and their local stand-ins ----------
  # Postgres stands in for Cloud SQL (one database per registry, like on GCP).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: s1, POSTGRES_PASSWORD: local-only }
    configs:
      - { source: postgres-init, target: /docker-entrypoint-initdb.d/init.sql }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "s1"]
      interval: 5s

  # Single-node Kafka standing in for Aiven (no TLS locally). Topics are created on first use.
  #   from containers: kafka:9092      from your laptop (e.g. a local Flink run): localhost:29092
  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 2
    ports:
      - "29092:29092"

  farm-registry:
    build: { context: ., dockerfile: services/farm-registry/Dockerfile }
    image: s1/farm-registry
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+pg8000://s1:local-only@postgres/farm_registry
    ports: [ "8081:8080" ]
    depends_on: { postgres: { condition: service_healthy } }

  sensor-registry:
    build: { context: ., dockerfile: services/sensor-registry/Dockerfile }
    image: s1/sensor-registry
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+pg8000://s1:local-only@postgres/sensor_registry
      FARM_REGISTRY_URL: http://farm-registry:8080
    ports: [ "8082:8080" ]
    depends_on: { postgres: { condition: service_healthy }, farm-registry: { condition: service_started } }

  irrigation-controller:
    build: { context: ., dockerfile: services/irrigation-controller/Dockerfile }
    image: s1/irrigation-controller
    restart: unless-stopped
    environment:
      FARM_REGISTRY_URL: http://farm-registry:8080
      SENSOR_REGISTRY_URL: http://sensor-registry:8080
      PARTITION_MANAGER_ADDR: partition-manager:50051
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092    # watering decisions -> topic "irrigation"
      # STATE_BACKEND=memory and ALERTS_BACKEND=log by default: alerts appear in this container's log
    ports: [ "8083:8080" ]
    depends_on: [ farm-registry, sensor-registry, partition-manager, kafka ]

  # ---------- Person 2: sensor readings into the hash ring and Kafka ----------
  telemetry-ingestion:
    build: { context: ., dockerfile: services/telemetry-ingestion/Dockerfile }
    image: s1/telemetry-ingestion
    restart: unless-stopped
    environment:
      PARTITION_MANAGER_ADDR: partition-manager:50051
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    ports: [ "8084:8080" ]
    depends_on: [ partition-manager, kafka ]

configs:
  postgres-init:
    content: |
      CREATE DATABASE farm_registry;
      CREATE DATABASE sensor_registry;

volumes:
  ring:
  store0:
  store1:
  store2:
  store3:
  store4:
  pgdata:
