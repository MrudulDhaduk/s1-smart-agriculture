# Generated by make_dashboard.py - edit that file, not this one.
# kubectl apply -f observability/dashboards/s1-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: s1-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  s1-dashboard.json: |
    {
      "uid": "s1-smart-agriculture",
      "title": "S1 Smart Agriculture: partitioning and scaling",
      "tags": [
        "s1"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Traffic: the golden signals",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Requests per second (Partition Manager)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (method) (rate(pm_requests_total[1m]))",
              "legendFormat": "{{method}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error rate %",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (sum(rate(pm_requests_total{status=\"error\"}[1m])) or vector(0)) / clamp_min(sum(rate(pm_requests_total[1m])), 1e-9)",
              "legendFormat": "failed requests %"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (sum(rate(pm_replica_writes_total{result=\"failed\"}[1m])) or vector(0)) / clamp_min(sum(rate(pm_replica_writes_total[1m])), 1e-9)",
              "legendFormat": "failed replica writes %"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "WriteReading latency",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(pm_request_latency_seconds_bucket{method=\"WriteReading\"}[1m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(pm_request_latency_seconds_bucket{method=\"WriteReading\"}[1m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(pm_request_latency_seconds_bucket{method=\"WriteReading\"}[1m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "Scaling: HPA on Partition Manager",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Partition Manager pods (HPA)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_horizontalpodautoscaler_status_current_replicas{namespace=\"s1\", horizontalpodautoscaler=\"partition-manager\"})",
              "legendFormat": "current pods"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"s1\", horizontalpodautoscaler=\"partition-manager\"})",
              "legendFormat": "desired pods"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"s1\", horizontalpodautoscaler=\"partition-manager\"})",
              "legendFormat": "max allowed"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU per Partition Manager pod (millicores; HPA target = 50m)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1000 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"s1\", container=\"partition-manager\"}[1m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "Partitioning: the consistent hashing ring",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "bargauge",
          "title": "Sensors stored per ring node (keys per node)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (node) (ss_sensors_stored)",
              "legendFormat": "{{node}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Writes per second per ring node",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (rate(pm_replica_writes_total{result=\"ok\"}[1m]))",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Ring",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 19,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(pm_ring_version)",
              "legendFormat": "ring version"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(pm_ring_nodes)",
              "legendFormat": "ring nodes"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(pm_rebalance_events_total)",
              "legendFormat": "rebalance events"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(pm_rebalance_sensors_moved_total)",
              "legendFormat": "sensors moved"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Cluster health",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 13,
          "type": "stat",
          "title": "App pods (namespace s1)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_phase{namespace=\"s1\", phase=\"Running\"})",
              "legendFormat": "running"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_ready{namespace=\"s1\", condition=\"false\"})",
              "legendFormat": "not ready"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"s1\"}[15m]))",
              "legendFormat": "restarts (15 min)"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Machine CPU %",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 28,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[1m])))",
              "legendFormat": "CPU used %"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Machine memory %",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 28,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes))",
              "legendFormat": "memory used %"
            }
          ]
        }
      ]
    }
